# GanttProject Mobile — Gradle settings for the Android build.

# Enough heap for the Kotlin and Compose compilers; the default is too small
# and fails late with an unhelpful out-of-memory error.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Required by every AndroidX dependency, which here means all of Compose.
# Without it the build stops at checkDebugAarMetadata before compiling a line.
android.useAndroidX=true

# Each module gets only its own R class instead of one containing every
# dependency's resources. Smaller, faster, and the modern default.
android.nonTransitiveRClass=true

kotlin.code.style=official
