import javax.inject.Inject
import org.gradle.api.file.FileSystemOperations
import org.gradle.process.ExecOperations

// Path to launch4j binary
ext.launch4j = '/opt/launch4j/launch4j'
// Directories where we build the distro
ext.distBinDir = file('dist-bin')

version = "${rootProject.version}"

ant.importBuild 'build.xml'
ant.properties.distBin = 'dist-bin'
ant.properties.distDebWork = "deb"
ant.properties.distDebPackage = "${rootProject.layout.buildDirectory.dir('distributions').get().asFile}"
ant.properties.version = "${rootProject.version}"
ant.properties.version_build = "${rootProject.version}"

interface InjectedServices {
    @Inject FileSystemOperations getFs()
    @Inject ExecOperations getExec()
}
def injected = objects.newInstance(InjectedServices)

def devNull = new OutputStream() {
    @Override
    public void write(int b) {}
}

clean {
    delete += "dist-bin"
}

task distBin(dependsOn: [
        ':biz.ganttproject.app.libs:copyPlugin',
        ':biz.ganttproject.app.localization:copyPlugin',
        ':biz.ganttproject.core:copyPlugin',
        ':ganttproject:copyPlugin',
        ':biz.ganttproject.impex.ical:copyPlugin',
        ':biz.ganttproject.impex.msproject2:copyPlugin',
        ':org.ganttproject.chart.pert:copyPlugin',
        ':org.ganttproject.impex.htmlpdf:copyPlugin'
    ]) {
    println "===== Building GanttProject ${version} ====="
    println "===== Building generic binary distro ====="
    doLast {
        injected.fs.copy {
            into(rootProject.distBinDir)
            from(fileTree(".")) {
                include "lib/javagalician.jar"
                include "lib/slf4j*.jar"
                include "lib/logback*.jar"
                include "ganttproject.bat"
                include "ganttproject.exe"
                include "ganttproject.l4j.ini"
                include "HouseBuildingSample.gan"
                include "LICENSE"
            }
        }
        injected.fs.copy {
            into(rootProject.distBinDir)
            from(fileTree(".")) {
                include "ganttproject"
                include "ganttproject.command"
            }
            filePermissions {
                unix("rwxr-xr-x")
            }
        }
        injected.fs.copy {
            into(rootProject.pluginsDir)
            from(fileTree(".")) {
                include "VERSION"
            }
        }
    }
}

// [Fork-Aenderung] Kurz-Commit fuer den Paketnamen.
//
// 3.4.3394 ist die Versionszaehlung des ORIGINALS; dieser Fork fuehrt keine eigene. Der Commit ist
// damit das Einzige, was den Stand eines Pakets eindeutig benennt.
//
// Faellt git aus (Bau aus einem Tarball, kein git im Pfad), bleibt "nocommit" stehen, statt den Bau
// abzubrechen. Ueber ProcessBuilder statt ueber die Gradle-exec-API, weil der Name schon zur
// Konfigurationszeit feststehen muss.
def forkCommit = {
    try {
        def proc = new ProcessBuilder('git', 'rev-parse', '--short=8', 'HEAD')
                .directory(rootProject.projectDir).redirectErrorStream(true).start()
        def text = proc.inputStream.text.trim()
        return (proc.waitFor() == 0 && text ==~ /[0-9a-f]{8}/) ? text : 'nocommit'
    } catch (Exception ignored) {
        return 'nocommit'
    }
}()

tasks.register('distZip', Zip) {
    // [Fork-Aenderung] Name nach dem Schema dieses Forks statt "ganttproject-<version>.zip".
    //
    // Sonst muss jeder Bau von Hand umbenannt werden, und irgendwann vergisst es jemand -- dann
    // haengt an einem Release ein Paket, dem man weder den Fork noch den Stand ansieht.
    archiveFileName = "ganttproject-effort-driven-${version}-generic-${forkCommit}.zip"
    destinationDirectory = rootProject.layout.buildDirectory.dir("distributions")
    from 'dist-bin'
    // [Fork-Aenderung] Protokolldateien gehoeren nicht ins Paket.
    //
    // logback.xml schreibt <file>${log_path:-ganttproject.log}</file>, also ins ARBEITS-
    // VERZEICHNIS. Wer aus dist-bin startet (ganttproject.bat, runApp), legt die Datei damit
    // genau dort ab, und distZip kopiert dist-bin vollstaendig -- die Datei landet im Archiv.
    // Einmal passiert; sie war leer, haette aber Pfade und Projektnamen enthalten koennen.
    // Die Falle schaerft sich bei jedem Start neu, deshalb der Stern statt nur ganttproject.log.
    exclude '*.log'
    // [Fork-Aenderung] Die eingecheckte ganttproject.exe gehoert NICHT ins generische Zip.
    //
    // Sie ist 32-Bit -- PE-Machine 0x014c (i386), nachgemessen am Kopf der Datei -- und laedt die
    // JVM im eigenen Prozess. Eine 64-Bit-JRE kann sie damit nicht laden. Beim Doppelklick
    // passiert deshalb NICHTS: kein Fenster, keine Meldung, weil <errTitle> in
    // ganttproject-launch4j.xml leer ist. Genau diese Datei klickt ein Windows-Nutzer aber als
    // Erstes an. Eine fehlende Datei ist besser als eine stumme; der Weg im generischen Paket ist
    // ganttproject.bat.
    //
    // NUR hier ausgeschlossen, nicht aus distBin entfernt: ganttproject.nsi.tpl (Installer) und
    // ganttproject-launch4j.xml verweisen weiterhin auf sie. Beide Bauwege sind in diesem Fork
    // auskommentiert und nicht benutzbar, sollen aber nicht stillschweigend kaputtgehen.
    exclude 'ganttproject.exe'
}
tasks.distZip.dependsOn distBin

// [Fork-Aenderung] Das Windows-Paket als Archiv, statt es von Hand zu packen.
//
// distApp erzeugt nur das VERZEICHNIS dist-app/GanttProject. Bis hierher wurde daraus von Hand
// ein Zip gemacht -- zweimal nachweislich, in zwei Sitzungen, und beide Male ohne dass es im
// Bauskript stand. Ein Bauweg, der einen Handgriff braucht, ist keiner: der Dateiname war nicht
// garantiert, der Kurz-Commit im Namen erst recht nicht, und niemand konnte das Paket
// nachbauen.
//
// Dasselbe Namensschema und derselbe Log-Ausschluss wie beim generischen Zip. Die 32-Bit-exe
// muss hier nicht ausgeschlossen werden -- distApp nimmt sie schon nicht in den Zwischenstand
// auf (siehe exclude weiter unten im distApp-Task).
tasks.register('distWin64Zip', Zip) {
    // Als Zeichenkette und nicht als Verweis: distApp wird weiter unten in dieser Datei
    // definiert, hier oben gibt es die Eigenschaft noch nicht. Gradle bricht sonst schon beim
    // Auswerten ab -- "Could not get unknown property 'distApp'".
    dependsOn 'distApp'
    archiveFileName = "ganttproject-effort-driven-${version}-win64-${forkCommit}.zip"
    destinationDirectory = rootProject.layout.buildDirectory.dir("distributions")
    from 'dist-app'
    exclude '*.log'
}

// [fork change] Builds the bundled Java runtime so that ganttproject.exe starts.
//
// WHY THIS IS NECESSARY: ganttproject-launch4j.xml points at a runtime under .\runtime\. It was
// never produced here -- the jlink block in the root build.gradle is commented out, and distWin
// copies a runtime/ from the project root that does not exist. Without runtime\ the exe falls back
// to the system Java and aborts with "GanttProject needs Java 21+ with JavaFX modules" before a
// window appears. Demonstrated on screen.
//
// ALL-MODULE-PATH instead of a module list: GanttProject loads its extensions through eclipsito at
// run time. What is needed in the process cannot be determined reliably in a static way, and a
// missing module only shows up in operation. The price is about 200 MB.
task distRuntime(dependsOn: distBin) {
    doLast {
        def jdk = file(System.getProperty('java.home'))
        def jmods = new File(jdk, 'jmods')
        if (!jmods.isDirectory()) {
            throw new GradleException(
                "Keine jmods in ${jdk} -- die mitgelieferte Laufzeit braucht ein volles JDK.\n" +
                "Mit JAVA_HOME auf ein JDK MIT JavaFX bauen, hier zuletzt jdk-21.0.12-full.")
        }
        def target = new File(distBinDir, 'runtime')
        // Leave an existing runtime in place. Two reasons: producing 200 MB anew on every build
        // is a waste, and Windows does not release the loaded DLLs (jvm.dll) immediately after
        // exit -- deleting then failed with "Zugriff verweigert" (access denied), although no
        // process was running any more. `clean` clears dist-bin away completely anyway.
        if (new File(target, 'bin/java.exe').isFile()) {
            println "= Mitgelieferte Laufzeit ist vorhanden, bleibt stehen (fuer Neubau: clean)."
            return
        }
        println "= Baue mitgelieferte Laufzeit nach ${target} ..."
        injected.exec.exec {
            commandLine new File(jdk, 'bin/jlink').toString(),
                '--module-path', jmods.toString(),
                '--add-modules', 'ALL-MODULE-PATH',
                '--strip-debug', '--no-header-files', '--no-man-pages', '--compress=zip-6',
                '--output', target.toString()
        }
    }
}

// [fork change] Builds a real Windows launcher with jpackage.
//
// WHY NOT THE EXISTING ganttproject.exe: it is a CHECKED-IN, prebuilt launch4j file and, according
// to its PE header, 32-bit (i386). It loads the JVM in the same process and therefore cannot load
// a 64-bit runtime -- measured: jstack reports "Unable to attach to 32-bit process running under
// WOW64". The process starts, does nothing, the log stays empty, and because <errTitle> is empty
// there is not even a message. It cannot be regenerated here: the launch4j calls in the build are
// commented out and point at /opt/launch4j, a Linux path.
//
// jpackage is part of the JDK, produces a 64-bit launcher and embeds the runtime. The call
// reproduces what ganttproject.bat does: eclipsito as the main class, the same arguments, the same
// --add-exports from javaExportOptions (the list runApp uses as well).
task distApp(dependsOn: [distBin, distRuntime]) {
    doLast {
        def jdk = file(System.getProperty('java.home'))
        def target = file('dist-app')
        // Intermediate state without runtime/: whatever lies in --input jpackage copies along.
        // The runtime comes via --runtime-image and would otherwise be in the result twice, about
        // 200 MB for nothing.
        def staging = file("${layout.buildDirectory.get().asFile}/jpackage-input")
        // FIRST build next to dist-app, THEN swap. Before, dist-app was deleted first; if the
        // deletion failed on a Windows file lock (the handles of a terminated GanttProject persist
        // for a short while), a half-deleted dist-app was left behind -- an .exe that does nothing
        // on a double click because app/plugins is missing. Happened on screen.
        def fresh = file("${layout.buildDirectory.get().asFile}/jpackage-out")
        injected.fs.delete { delete staging, fresh }
        injected.fs.copy {
            from distBinDir
            into staging
            exclude 'runtime/**', 'ganttproject.exe', '*.l4j.ini'
        }

        // [fork change] Compile the fork's own main class into the app folder, see ForkLauncher.
        //
        // It sits as a .class directly in the intermediate state, because app.classpath contains
        // the app folder itself (appended further down). A jar of its own would be ornament: one
        // class.
        println '= Uebersetze die eigene Starterklasse ...'
        injected.exec.exec {
            commandLine new File(jdk, 'bin/javac').toString(),
                    '-encoding', 'UTF-8',
                    '-classpath', new File(staging, 'eclipsito.jar').toString(),
                    '-d', staging.toString(),
                    file('launcher/net/sourceforge/ganttproject/launcher/ForkLauncher.java').toString()
        }

        def args = [new File(jdk, 'bin/jpackage').toString(),
                    '--type', 'app-image',
                    '--name', 'GanttProject',
                    '--app-version', "${project.version}".replaceAll('[^0-9.].*$', ''),
                    '--dest', fresh.toString(),
                    '--input', staging.toString(),
                    '--runtime-image', new File(distBinDir, 'runtime').toString(),
                    '--main-jar', 'eclipsito.jar',
                    // [fork change] The fork's own main class instead of eclipsito directly.
                    //
                    // The eclipsito arguments used to stand here as --arguments and ended up as
                    // [ArgOptions] in the .cfg. That is a DEFAULT: as soon as the launcher is
                    // called with an argument -- on a double click on a .gan Windows passes the
                    // file path -- this argument replaces the default completely. eclipsito then
                    // got only a file name, without --app and without --version-dirs, aborted,
                    // and the launcher reported a blanket "Failed to launch JVM".
                    //
                    // ForkLauncher carries the arguments in code and appends the outside ones.
                    // Hence NO --arguments here any more: on a start without a file the default
                    // would otherwise be in the list a second time.
                    '--main-class', 'net.sourceforge.ganttproject.launcher.ForkLauncher',
                    '--icon', file('ganttproject.ico').toString()]
        args += ['--java-options', '-Xmx2048m', '--java-options', '-Dgpcloud=prod',
                 '--java-options', '-Dorg.jooq.no-logo=true',
                 '--java-options', '-Dsun.java2d.d3d=false']
        // javaExportOptions is a flat list of switch and value. Both have to go into ONE
        // --java-options, joined with '=': "--add-exports=module/package=ALL-UNNAMED".
        //
        // DEMONSTRATED, why not with a space: jpackage splits the value at it and writes two lines
        // into the .cfg. The switch thereby loses its argument, the JVM aborts at startup -- the
        // process runs, shows no window and writes no log. Seen exactly like
        // that.
        javaExportOptions.collate(2).each { pair ->
            args += ['--java-options', pair.join('=')]
        }

        println '= Baue Windows-Starter mit jpackage ...'
        injected.exec.exec { commandLine args }

        // The app folder ITSELF onto the classpath. jpackage enters only the jar files there;
        // ganttproject.bat, however, additionally sets %GP_HOME%, that is, the directory. Without
        // it the user interface did not come up -- the start stopped after "Starting the UI", the
        // log ended after the environment block. With the directory it runs through.
        def cfg = new File(fresh, 'GanttProject/app/GanttProject.cfg')
        if (!cfg.isFile()) {
            throw new GradleException("jpackage schrieb keine Konfiguration: ${cfg}")
        }
        // Without a regular expression: in the replacement $APPDIR would be a group reference and
        // the call would abort with "Illegal group reference".
        def lines = cfg.readLines()
        def lastCp = lines.findLastIndexOf { it.startsWith('app.classpath=') }
        if (lastCp < 0) {
            throw new GradleException("Kein app.classpath in ${cfg} -- Aufbau unerwartet.")
        }
        lines.add(lastCp + 1, 'app.classpath=$APPDIR')
        cfg.text = lines.join(System.lineSeparator()) + System.lineSeparator()

        // Only now, with the new state lying complete alongside, replace the old one.
        def built = new File(fresh, 'GanttProject/GanttProject.exe')
        if (!built.isFile()) {
            throw new GradleException("jpackage lieferte keinen Starter: ${built}")
        }
        injected.fs.delete { delete target }
        if (target.exists()) {
            throw new GradleException(
                "dist-app liess sich nicht ersetzen -- laeuft GanttProject noch?\n" +
                "Der neue Stand liegt unversehrt in ${fresh}.")
        }
        injected.fs.copy { from fresh; into target }
        println "= Fertig: ${new File(target, 'GanttProject/GanttProject.exe')}"
    }
}

