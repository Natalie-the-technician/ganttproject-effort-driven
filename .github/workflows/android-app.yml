# Builds and tests the Android app in android/.
#
# Deliberately scoped by `paths`: the desktop workflows must not run for a
# change that only touches the app, and this one must not run for desktop
# changes. The two builds share a repository, not a toolchain.
name: Android app

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  # Lets an APK be produced on demand, and optionally published as a release
  # so it can be installed straight from the GitHub mobile app.
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: true
      notes:
        description: "Optional note shown on the release page"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  core:
    # The core module carries every rule that can silently corrupt a project
    # file, so it is tested on its own first: a failure here should be
    # obvious and not buried in an Android build log.
    name: Core tests (no Android SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :gantt-core:test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        # A report is a convenience, not the result. The tests had already
        # passed when this step took the whole job down because the artifact
        # storage quota was full -- a build reporting failure while the thing
        # it builds is fine is worse than no report at all.
        continue-on-error: true
        with:
          name: core-test-report
          path: android/gantt-core/build/reports/tests/test
          if-no-files-found: ignore
          # Default is 90 days. A report nobody looked at within a week is one
          # nobody will, and every stale one eats the same quota that stopped
          # this build.
          retention-days: 7

  app:
    name: Build APK
    runs-on: ubuntu-latest
    needs: core
    permissions:
      # Only this job may write, and only so it can publish a release.
      # The workflow default above stays read-only.
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK; this action pins it onto the
      # PATH and exports ANDROID_HOME, which is also what makes settings.gradle
      # include the :app module at all.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No --stacktrace. A Kotlin compile error is a single "e: file://…"
      # line, and 200 lines of Gradle internals push it clean out of any
      # reasonable log tail — which cost two debugging rounds to learn.
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee assemble.log

      # Repeats the compiler diagnostics at the very end of the log, where
      # they can be read without scrolling past the stack trace.
      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "--- compiler diagnostics ---"
          # Kotlin marks its diagnostics with "e: "/"w: ", but a build can
          # also fail in resource merging or javac, and those say neither.
          # Missing them once cost an afternoon of green core tests next to a
          # red APK, so the net is wider than one toolchain.
          grep -E '^(e|w): |error:|FAILED|Failed to ' assemble.log | head -50 || echo "none found"

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      # Skipped when a release is going to be published anyway: the same APK
      # would be stored twice, and at ~18 MB a run that is what filled the
      # artifact quota in the first place. A release does not count against it
      # and is the copy that can actually be installed from a phone.
      - name: Upload APK
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/claude/gantt-android-app-wxxu9o') }}
        uses: actions/upload-artifact@v4
        with:
          # Download this from the run's summary page and install it on the
          # phone; no Play Store or signing key involved.
          name: ganttproject-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      # Artifacts can only be downloaded through a browser and arrive as a
      # ZIP; a release attaches the APK directly, installs with one tap from
      # the GitHub mobile app, and does not expire after 90 days.
      #
      # Uses the preinstalled gh CLI rather than a third-party action, to keep
      # the supply chain of a public repository as small as possible.
      #
      # Published on a manual run, and also on every push to the app branch.
      # The second half is a deliberate relaxation of the original rule ("only
      # on a manual run, so ordinary pushes do not litter the release list"):
      # while one person is the only user of this branch, a cluttered release
      # list costs nothing and a manual step every time costs something real --
      # the artifact alone cannot be installed from a phone.
      #
      # Scoped to the one branch on purpose. Every other branch keeps the old
      # behaviour, so the day somebody else works here the rule is still there.
      - name: Publish release with the APK
        # One line on purpose. Written as a folded block it picked up a stray
        # newline from the deeper-indented continuation, which YAML keeps
        # verbatim rather than folding -- the expression then contained a line
        # break in the middle.
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release) || (github.event_name == 'push' && github.ref == 'refs/heads/claude/gantt-android-app-wxxu9o') }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as environment variables, never interpolated into the
          # script body: a ${{ }} expression is substituted as raw text before
          # the shell sees it, so a crafted input could otherwise run
          # arbitrary commands here.
          RELEASE_NOTES: ${{ inputs.notes }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="mobile-v${version}-build${RUN_NUMBER}"
          apk="ganttproject-mobile-${version}-build${RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"

          # Deliberately NOT --prerelease. GitHub hides prereleases from
          # /releases/latest and from the "Latest" badge, which is exactly the
          # shortcut that makes a release worth having on a phone. The notes
          # below say plainly what kind of build this is instead.
          {
            echo "Debug build of GanttProject Mobile, signed with the standard"
            echo "Android debug key. Install it by tapping the .apk below and"
            echo "allowing installation from unknown sources when asked."
            echo
            echo "Requires Android 8.0 (API 26) or newer."
            echo
            echo "- Branch: \`${BRANCH_NAME}\`"
            echo "- Commit: ${COMMIT_SHA}"
            if [ -n "${RELEASE_NOTES}" ]; then
              echo
              echo "${RELEASE_NOTES}"
            fi
          } > release-notes.md

          gh release create "$tag" "$apk" \
            --title "GanttProject Mobile $version (build ${RUN_NUMBER})" \
            --notes-file release-notes.md \
            --target "${COMMIT_SHA}"
