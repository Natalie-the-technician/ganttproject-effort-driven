# Builds and tests the Android app in android/.
#
# Deliberately scoped by `paths`: the desktop workflows must not run for a
# change that only touches the app, and this one must not run for desktop
# changes. The two builds share a repository, not a toolchain.
name: Android app

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  # Lets an APK be produced on demand, and optionally published as a release
  # so it can be installed straight from the GitHub mobile app.
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: true
      notes:
        description: "Optional note shown on the release page"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  core:
    # The core module carries every rule that can silently corrupt a project
    # file, so it is tested on its own first: a failure here should be
    # obvious and not buried in an Android build log.
    name: Core tests (no Android SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :gantt-core:test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: android/gantt-core/build/reports/tests/test
          if-no-files-found: ignore

  app:
    name: Build APK
    runs-on: ubuntu-latest
    needs: core
    permissions:
      # Only this job may write, and only so it can publish a release.
      # The workflow default above stays read-only.
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK; this action pins it onto the
      # PATH and exports ANDROID_HOME, which is also what makes settings.gradle
      # include the :app module at all.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Download this from the run's summary page and install it on the
          # phone; no Play Store or signing key involved.
          name: ganttproject-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Artifacts can only be downloaded through a browser and arrive as a
      # ZIP; a release attaches the APK directly, installs with one tap from
      # the GitHub mobile app, and does not expire after 90 days.
      #
      # Only on a manual run, so ordinary pushes do not litter the release
      # list. Uses the preinstalled gh CLI rather than a third-party action,
      # to keep the supply chain of a public repository as small as possible.
      - name: Publish release with the APK
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as environment variables, never interpolated into the
          # script body: a ${{ }} expression is substituted as raw text before
          # the shell sees it, so a crafted input could otherwise run
          # arbitrary commands here.
          RELEASE_NOTES: ${{ inputs.notes }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="mobile-v${version}-build${RUN_NUMBER}"
          apk="ganttproject-mobile-${version}-build${RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"

          # Deliberately NOT --prerelease. GitHub hides prereleases from
          # /releases/latest and from the "Latest" badge, which is exactly the
          # shortcut that makes a release worth having on a phone. The notes
          # below say plainly what kind of build this is instead.
          {
            echo "Debug build of GanttProject Mobile, signed with the standard"
            echo "Android debug key. Install it by tapping the .apk below and"
            echo "allowing installation from unknown sources when asked."
            echo
            echo "Requires Android 8.0 (API 26) or newer."
            echo
            echo "- Branch: \`${BRANCH_NAME}\`"
            echo "- Commit: ${COMMIT_SHA}"
            if [ -n "${RELEASE_NOTES}" ]; then
              echo
              echo "${RELEASE_NOTES}"
            fi
          } > release-notes.md

          gh release create "$tag" "$apk" \
            --title "GanttProject Mobile $version (build ${RUN_NUMBER})" \
            --notes-file release-notes.md \
            --target "${COMMIT_SHA}"
