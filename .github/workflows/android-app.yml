# Builds and tests the Android app in android/.
#
# Deliberately scoped by `paths`: the desktop workflows must not run for a
# change that only touches the app, and this one must not run for desktop
# changes. The two builds share a repository, not a toolchain.
name: Android app

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  # Lets a release APK be produced on demand without pushing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    # The core module carries every rule that can silently corrupt a project
    # file, so it is tested on its own first: a failure here should be
    # obvious and not buried in an Android build log.
    name: Core tests (no Android SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :gantt-core:test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: android/gantt-core/build/reports/tests/test
          if-no-files-found: ignore

  app:
    name: Build APK
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK; this action pins it onto the
      # PATH and exports ANDROID_HOME, which is also what makes settings.gradle
      # include the :app module at all.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Download this from the run's summary page and install it on the
          # phone; no Play Store or signing key involved.
          name: ganttproject-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
