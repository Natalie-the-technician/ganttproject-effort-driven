# NEUE DATEI DIESES FORKS - im Original-GanttProject nicht vorhanden.
#
# Texte dieses Forks, Deutsch. Datei ist UTF-8; ForkI18n liest sie ausdruecklich als UTF-8,
# weil Properties.load sonst ISO-8859-1 annimmt und jeden Umlaut zerstoert.

fork.effort.section=Aufwand
fork.effort.hours=Stunden
fork.effort.hoursPerDay=Std./Tag
fork.effort.actualHours=Ist-Stunden

# Anzeigenamen der eigenen Spalten. Sie erscheinen als Spaltenkopf und stehen in der
# Projektdatei. Die technische id (effort_hours, ...) wird NICHT uebersetzt.
fork.column.effort=Aufwand (Std.)
fork.column.actualEffort=Ist-Aufwand (Std.)
fork.column.hoursPerDay=Stunden pro Tag
fork.column.togglImported=Toggl importiert

fork.toggl.section=Zeiterfassung
fork.toggl.token=Toggl-Token
fork.toggl.checkConnection=Toggl-Verbindung prüfen

# Ergebnis des Verbindungstests. {0} ist der Name der Person, {1} die Anzahl.
# Bewusst aus der Fehlerart gebaut, NICHT aus der Meldung der Ausnahme: die ist englisch
# und gehoert ins Protokoll.
# Zwei Token beanspruchen denselben Schluessel. {0} ist die Adresse bzw. der Name.
# Die Knoepfe benennen ausdruecklich, was VERLOREN geht - "Ueberschreiben" allein sagt nichts
# darueber, und der Verlust faellt sonst erst viel spaeter auf.
fork.toggl.collision.title=Zwei Toggl-Token für dieselbe Person
fork.toggl.collision.what=Für „{0}" ist bereits ein anderer Toggl-Token gespeichert. Es kann nur einer davon bleiben.
fork.toggl.collision.consequence=Die Adresse benennt das Toggl-Konto. Zwei verschiedene Token für dieselbe Adresse heißt: einer davon ist veraltet. Welcher, lässt sich hier nicht erkennen.
# Die Folge steht im Text, NICHT in der Knopfbeschriftung: die Knoepfe haben feste Breite, ein
# laengerer Text wird abgeschnitten und die Folge waere unlesbar. Am Bildschirm nachgewiesen.
fork.toggl.collision.choice=„Neuen behalten" verwirft den bisher gespeicherten Token. „Bisherigen behalten" verwirft den soeben eingetragenen. Der verworfene ist danach weg und müsste neu eingetragen werden.
fork.toggl.collision.overwrite=Neuen behalten
fork.toggl.collision.discard=Bisherigen behalten

# Import der Zeiten. {0} und {1} sind Anzahlen bzw. Stunden.
fork.toggl.import=Toggl-Zeiten importieren
fork.toggl.import.running=Zeiten der letzten {0} Tage werden abgerufen …
# Zeitraum des Imports. Bewusst eine Zahl statt eines Hakens „auch ältere": „älter" hat kein Ende.
# Zuordnungsdialog (Schritt 6). {0} ist die Anzahl.
# WebDAV: die Sperre beim Öffnen war nicht zu bekommen. {0} ist der Dateiname.
fork.webdav.lockFailed=Für „{0}" konnte keine Sperre gesetzt werden — vermutlich hat jemand anderes das Projekt geöffnet. Das Projekt ist offen und lesbar. Beim Speichern wird geprüft, ob sich die Datei inzwischen geändert hat; bei einem Konflikt wird gefragt, statt zu überschreiben.

fork.toggl.assign.title=Einträge Vorgängen zuordnen
fork.toggl.assign.what={0} Einträge nennen keine Vorgangsnummer. Bitte den passenden Vorgang auswählen — was auf „nicht zuordnen" bleibt, wird übersprungen.
fork.toggl.assign.hint=Vorausgewählt wird nur, wenn die Zuordnung eindeutig ist. Geplante Dauer, Aufwand, Status und Fertigstellung bleiben unberührt.
fork.toggl.assign.column.entry=Eintrag
fork.toggl.assign.column.task=Vorgang
fork.toggl.assign.none=— nicht zuordnen —

fork.toggl.period.title=Zeitraum des Imports
fork.toggl.period.what=Wie viele Tage zurück sollen die Toggl-Einträge abgefragt werden?
fork.toggl.period.hint=Bereits importierte Einträge werden dabei nicht doppelt gezählt. Höchstens {0} Tage.
fork.toggl.period.invalid=Bitte eine ganze Zahl zwischen {0} und {1} eintragen.
fork.toggl.import.undo=Toggl-Zeiten importiert
fork.toggl.import.preview=Es werden {0} Vorgängen zusammen {1,number,0.00} Stunden gutgeschrieben. Geplante Dauer, Aufwand, Status und Fertigstellung bleiben unberührt.
fork.toggl.import.overrun=Bei {0} Vorgängen übersteigen die erfassten Stunden den geplanten Aufwand. Das ist ein Hinweis — es wird nichts korrigiert.
fork.toggl.import.nothingNew=Es gibt nichts Neues zu übernehmen. Alle gefundenen Einträge wurden bereits importiert.
fork.toggl.import.done={0} Vorgänge wurden aktualisiert. Rückgängig macht den gesamten Import in einem Schritt.
fork.toggl.import.failed=Bei {0} Vorgängen ist das Schreiben fehlgeschlagen. Einzelheiten stehen im Protokoll.
fork.toggl.import.unknownNumber={0} Einträge nennen eine Vorgangsnummer, die es in diesem Projekt nicht gibt. Vermutlich ein Tippfehler in Toggl.
fork.toggl.import.withoutNumber={0} Einträge nennen keine Vorgangsnummer und wurden übersprungen. Sie lassen sich derzeit nur zuordnen, indem die Nummer in Toggl ergänzt wird, etwa „#332 Firmware".

fork.toggl.check.title=Toggl-Verbindung
fork.toggl.check.noToken=Es ist kein Toggl-Token hinterlegt. Der Token wird in den Eigenschaften einer Ressource eingetragen, Abschnitt Zeiterfassung.
fork.toggl.check.ok=Die Verbindung steht. Für {0} wurden in den letzten sieben Tagen {1} Einträge gefunden. Es wurde nichts geändert.
fork.toggl.check.unreadable=Davon konnten {0} Einträge nicht gelesen werden:
fork.toggl.check.badRequest=Toggl hat die Anfrage abgelehnt. Meist ist der Zeitraum zu groß — es werden höchstens drei Monate auf einmal geliefert. Bitte mit einem kürzeren Zeitraum erneut versuchen.
fork.toggl.check.notAuthorised=Toggl hat den Token von {0} abgelehnt. Bitte den Token in den Eigenschaften der Ressource prüfen.
fork.toggl.check.rateLimited=Toggl hat zu viele Anfragen gemeldet. Bitte einen Moment warten und erneut versuchen.
fork.toggl.check.quotaExhausted=Das Anfragekontingent von Toggl ist für diesen Abrechnungszeitraum aufgebraucht.
fork.toggl.check.unavailable=Toggl war nicht erreichbar. Bitte die Internetverbindung prüfen. Einzelheiten stehen im Protokoll.
fork.toggl.check.running=Die Verbindung wird geprüft …

# Warum eine Aufteilung abgelehnt wurde. Erscheint im Zuordnungsdialog.
fork.split.empty=Es wurde nichts eingetragen.
fork.split.notPositive=Jeder Anteil muss eine positive Stundenzahl sein.
fork.split.duplicateTask=Derselbe Vorgang kommt zweimal vor.
fork.split.sumMismatch=Die Anteile ergeben {0,number,0.00} Std., der Eintrag hat aber {1,number,0.00} Std.

# Schreibkonflikt ausserhalb der GanttProject-Cloud (WebDAV oder oertliche Datei). Der Text
# "cloud.versionMismatch" erklaert den Konflikt mit der "Version aus dem Projektverlauf" -- das ist
# hier nicht der Grund: jemand anderes hat die Datei seit dem Lesen geaendert.
fork.webdav.versionMismatch.title=Datei wurde von jemand anderem geändert
fork.webdav.versionMismatch.titleHelp=Seit dem Öffnen hat jemand anderes diese Projektdatei geändert.\nJetzt zu speichern würde diese Änderung verwerfen.\nIhre eigenen Änderungen gehen so oder so nicht verloren — sie lassen sich als neue Kopie sichern.
