# Die dauerhaft sichtbare Meldung in der Mitte der Statuszeile. SIGNALFORM, kein Satz: am Schirm
# gemessen (02.09.2026) war der ganze Satz 453 px breit und brauchte ein 1890 px breites Fenster,
# ehe die Statuszeile ihn ungekuerzt zeigte -- auf einem 1920er Schirm war die volle Meldung
# trotzdem abgeschnitten. Der Grund liegt nicht an dieser Meldung, sondern an -fx-min-width: 50em
# in StatusBar.css, das zweimal in derselben Zeile haengt; hier ist nur die Seite zu bezahlen, die
# uns gehoert. Der lange Satz steht im Kurzhinweis darunter.
fork.staleness.message=Verteilung veraltet
