# Die Kurzhinweise (Tooltips). Sie tragen das WARUM, das aus den Beschriftungen herausgekuerzt
# wurde. Am 02.09.2026 gemessen: bis dahin gab es KEINEN, und der auf "..." zusammengedrueckte
# Text war am Schirm auf keinem Weg nachzulesen.
fork.staleness.message.tooltip=Der Plan hat sich geändert, seit die Kapazität zuletzt verteilt wurde — die Verteilung bildet den heutigen Stand nicht mehr ab.
fork.staleness.button.tooltip=Verteilt die Kapazität neu. Zeigt vorher, was sich verschieben würde, und bietet an, den heutigen Stand als Basisplan zu sichern.

# Die ZWEITE Aussage dieser Meldung: Vorgänge, die in KEINEM Basisplan stehen. Sie erscheint nur
# innerhalb der Meldung darüber und hat keinen eigenen Anlass aufzutauchen -- ein frisches Projekt
# zeigt nichts. Ohne jeden Basisplan ist sie eine bloße Feststellung OHNE Knopf: durch Drücken ist
# sie nicht zu erledigen, und eine Forderung, die niemand erfüllen kann, wird zur Tapete.
