# Die zwei Achsen einer Zuordnung (P1). Die Texte sind SPALTENKOEPFE im Zuordnungsreiter und
# muessen kurz bleiben. "Ohne Leistung" ist absichtlich verneint: nicht angehakt ist das, was das
# Programm bisher getan hat -- ein unberuehrtes Haekchen und eine alte Datei bedeuten dasselbe.
fork.assignment.blocking=Abwesenheit blockiert
fork.assignment.noEffort=Ohne Leistung

# Gar kein moeglicher Termin (P5 + P6, in P7 zusammengelegt). Der Fall fiel bis P5 STUMM zurueck:
# die Suche laeuft in ihre Schranke und legt den Vorgang auf den fruehesten Termin -- ein sichtbar
# falsches Datum ohne Begruendung. P5 nannte den einen Grund, P6 den anderen, in zwei Bloecken;
# ein Vorgang mit beiden Gruenden stand in beiden. Seit dem 27.08.2026 gibt es EINEN Block und
# einen Eintrag je Vorgang, und der traegt jeden Grund, der zutraf.
#
# DER AUSWEG STEHT IN DEN GRUNDZEILEN UND NICHT IN DER UEBERSCHRIFT, und das ist der Kern der
# Zusammenlegung, keine Umstellung. Die alten Ueberschriften endeten je in einem Ausweg; ueber
# einem Block, dessen Vorgaenge aus verschiedenen Gruenden scheitern, ist jeder einzelne Ausweg
# fuer einen Teil von ihnen falsch -- und wo beide Gruende zutreffen, sind beide Auswege wahr und
# einer allein reicht. Mehr sagt die Ueberschrift jetzt nicht.
fork.levelling.nodate={0,choice,1#Ein Vorgang findet|1<{0} Vorgaenge finden} ueberhaupt keinen Termin. {0,choice,1#Er bleibt|1<Sie bleiben} auf dem fruehestmoeglichen Termin stehen - dieses Datum ist falsch, und die Verteilung kann es nicht von selbst richtigstellen. Was dagegen zu tun ist, steht unter jedem Vorgang; wo zwei Gruende stehen, reicht es, EINEN davon zu beheben:
fork.levelling.nodate.task={0}:
# So formuliert, dass es fuer EINEN Namen genauso liest wie fuer mehrere. Eine einzige als
# blockierend markierte, nie anwesende Person ist ein echter und gemeldeter Fall -- siehe
# testASinglePersonWhoIsNeverThereIsReportedToo -- und die abgeloeste Formulierung ("{1} muessen
# alle gleichzeitig da sein") las sich dafuer falsch.
fork.levelling.nodate.blocked=die verfuegbaren Zeiten von {0} ueberschneiden sich nie lang genug - es gibt keinen Zeitraum, in dem alle als blockierend markierten Personen gleichzeitig da sind. "Alle muessen da sein" laesst sich nicht lockern, ohne das Gegenteil der Markierung zu sagen - zu aendern sind also die Markierungen oder die Ausfallzeiten.
# Gesagt wird absichtlich das GEMESSENE und nicht mehr: die Suche ist an bereits belegten Tagen
# abgeprallt. Sie behauptet nicht, jeder Tag sei voll -- siehe NoPossibleDate.fullFor.
# "der Genannten" und nicht "dieser Personen": in {0} kann fork.levelling.nodate.shared stehen,
# der Topf der Vorgaenge ohne Zuordnung, und der ist keine Person. Gemessen am gerenderten Text.
fork.levelling.nodate.full=kein Termin mit Platz: die Arbeitstage von {0} sind an jedem in Frage kommenden Termin schon belegt. Zu aendern ist die Auslastung der Genannten oder die Dauer des Vorgangs.
# Der Topf der Vorgaenge ohne Zuordnung. Sie belegen Zeit, man weiss nur nicht wessen -- und eine
# Meldung, die sie mit einer Leerstelle benennt, sagt weniger als nichts.
fork.levelling.nodate.shared=Vorgaengen ohne Zuordnung

# Umschalter fuer das Band unter dem Vorgangsbalken (Werkzeugleiste des Diagramms). Die
# Beschriftung nennt die GERADE GEZEIGTE Ansicht, nicht die, zu der der Knopf fuehrt.
# Zwei Ansichten, weil die Dauer in diesem Fork ein Rechenergebnis aus Aufwand und
# Tagesleistung ist: eine geaenderte Tagesleistung verschiebt jeden Termin, ohne dass sich
# an der Arbeit etwas geaendert haette.
fork.comparison.dates=Vergleich: Termin
fork.comparison.effort=Vergleich: Aufwand
fork.comparison.durations=Vergleich: Dauer
# Die vierte Ansicht traegt beide Achsen in einem Band. IHR NAME IST DIE EINZIGE STELLE,
# an der steht, welche Haelfte welche ist -- die Legende kann es nicht sagen, sie erklaert
# Farben und muss in allen vier Ansichten stimmen. Deshalb nennt die Beschriftung die zwei
# Achsen in der Reihenfolge, in der sie im Balken stehen: oben zuerst.
fork.comparison.dates_and_durations=Vergleich: Termin ueber Dauer

# Einstellungen, Seite "Gantt-Diagramm". Womit das Programm startet. Die Werte-Beschriftungen
# sind die drei obigen; sie kommen aus einem Werte-Uebersetzer, nicht aus eigenen Schluesseln.
option.comparisonAtStartup.label=Vergleich beim Programmstart

# Legende im Basisplan-Dialog ("Farben fuer den Versionsvergleich"). ERSETZT die drei
# urspruenglichen Beschriftungen; die stehen weiter im Hauptbuendel und werden nur nicht mehr
# gefragt -- siehe GanttGraphicArea.createBaselineColorOptions.
#
# WARUM SIE NEU GEFASST WERDEN MUSSTEN: das Band bedeutet in jeder der drei Vergleichsansichten
# etwas anderes, und der Dialog weiss nicht, welche gerade gezeigt wird. Keine Zeile darf also
# eine Groesse nennen -- kein Enddatum, keine Dauer, keine Stunden. Gleich bleibt allein die
# RICHTUNG: der gemessene Wert liegt ueber oder unter dem geplanten.
#
# Die graue Zeile sagt "einer der beiden", nicht "der Vergleichswert": in der Dauernansicht
# fehlt der GEPLANTE Wert, in der Aufwandsansicht der AKTUELLE.
fork.baseline.legend.missing=Einer der beiden Werte fehlt
fork.baseline.legend.below=Unter dem geplanten Wert
fork.baseline.legend.above=Über dem geplanten Wert

# WebDAV: die Sperre beim Öffnen war nicht zu bekommen. {0} ist der Dateiname.
fork.webdav.lockFailed=Für „{0}" konnte keine Sperre gesetzt werden — vermutlich hat jemand anderes das Projekt geöffnet. Das Projekt ist offen und lesbar. Beim Speichern wird geprüft, ob sich die Datei inzwischen geändert hat; bei einem Konflikt wird gefragt, statt zu überschreiben.

# Schreibkonflikt ausserhalb der GanttProject-Cloud (WebDAV oder oertliche Datei). Der Text
# "cloud.versionMismatch" erklaert den Konflikt mit der "Version aus dem Projektverlauf" -- das ist
# hier nicht der Grund: jemand anderes hat die Datei seit dem Lesen geaendert.
fork.webdav.versionMismatch.title=Datei wurde von jemand anderem geändert
fork.webdav.versionMismatch.titleHelp=Seit dem Öffnen hat jemand anderes diese Projektdatei geändert.\nJetzt zu speichern würde diese Änderung verwerfen.\nIhre eigenen Änderungen gehen so oder so nicht verloren — sie lassen sich als neue Kopie sichern.

# Hinweis unter den beiden Sperr-Einstellungen. Ein Wert unter 0 heisst "nie sperren", und
# acquireLock() meldet dabei Erfolg, ohne etwas zu tun -- ohne diese Zeile ist der Zustand
# unsichtbar. Der zweite Satz ist wichtig: seit D3 wird bedingt geschrieben, "ungeschuetzt" waere
# also falsch.
fork.webdav.lockTimeout.hint=<html>Ein Wert unter 0 bedeutet: nie sperren. Andere können die Datei dann gleichzeitig bearbeiten.<br>Zwischenzeitliche Änderungen werden beim Speichern trotzdem erkannt — Sie werden gefragt, statt zu überschreiben.</html>

# Der Server liefert ausschliesslich schwache ETags, ein bedingtes Schreiben ist damit unmoeglich.
# NIEMAND hat die Datei geaendert -- den Konflikttext hier zu verwenden waere falsch und schickte
# den Benutzer auf die Suche nach einem Kollegen, den es nicht gibt.
fork.webdav.noVersioning.title=Server kann die Version nicht bestätigen
fork.webdav.noVersioning.titleHelp=Dieser Server nennt nicht, welche Fassung der Datei er hält — das Speichern lässt sich deshalb nicht dagegen prüfen.\nTrotzdem zu schreiben könnte die Änderung eines anderen unbemerkt überschreiben.\nIhre Änderungen sind nicht verloren — sie lassen sich als neue Kopie sichern.

# Lesefehler, die KEINE kaputte Datei sind. Das Original nennt jede Ausnahme "Failed to parse
# document" und schickt den Benutzer damit zur Projektdatei, obwohl der Server ihn abgewiesen hat.
fork.document.notAuthorized=Der Server hat die Anmeldung abgelehnt. Zum WebDAV-Server ist vermutlich kein Passwort gespeichert — öffnen Sie das Projekt über Projekt → Öffnen und geben Sie es dort ein.
fork.document.unreachable=Der Server war nicht erreichbar. Bitte Netzverbindung und Serveradresse prüfen.

# Benannte Ansichten fuer grosse Plaene. Eine Ansicht ist eine BENANNTE MENGE AUSGEBLENDETER
# VORGAENGE; die Menge fuehrt das AUSGEBLENDETE, nicht das Eingeblendete. Deshalb bleibt ein
# spaeter angelegter Vorgang in jeder Ansicht sichtbar, statt aus allen auf einmal zu fallen.
fork.view.hideTask=In dieser Ansicht ausblenden
fork.view.showTask=In dieser Ansicht wieder einblenden
fork.view.showAll=Alles anzeigen
fork.view.manage=Ansichten verwalten …
fork.view.defaultName=Neue Ansicht
fork.view.hiddenCount={0,choice,0#nichts ausgeblendet|1#ein Vorgang ausgeblendet|1<{0} Vorgaenge ausgeblendet}
# Steht in der Werkzeugleiste ueber der Vorgangstabelle und ist zugleich der Rueckweg: ein Klick
# zeigt wieder alles. Im Original ist das eine Beschriftung, die man nicht anklicken kann.
fork.view.tasksHidden={0,choice,1#Ein Vorgang ist ausgeblendet - alles anzeigen|1<{0} Vorgaenge sind ausgeblendet - alles anzeigen}

fork.viewDialog.title=Vorgangsansichten
fork.viewDialog.addItem=Neue Ansicht
fork.viewDialog.visibility.label=Diese Ansicht benutzen
