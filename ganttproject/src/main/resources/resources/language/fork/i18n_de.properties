# NEUE DATEI DIESES FORKS - im Original-GanttProject nicht vorhanden.
#
# Texte dieses Forks, Deutsch. Datei ist UTF-8; ForkI18n liest sie ausdruecklich als UTF-8,
# weil Properties.load sonst ISO-8859-1 annimmt und jeden Umlaut zerstoert.

fork.effort.section=Aufwand
fork.effort.hours=Stunden
fork.effort.hoursPerDay=Std./Tag
fork.effort.actualHours=Ist-Stunden

# Anzeigenamen der eigenen Spalten. Sie erscheinen als Spaltenkopf und stehen in der
# Projektdatei. Die technische id (effort_hours, ...) wird NICHT uebersetzt.
fork.column.effort=Aufwand (Std.)
fork.column.actualEffort=Ist-Aufwand (Std.)
fork.column.hoursPerDay=Stunden pro Tag

# Kapazitaetsverteilung. Beide Menuepunkte fragen VOR dem Schreiben -- die Verteilung kann im
# Bezugsplan 167 von 226 Vorgaengen verschieben.
fork.column.dateFixed=Termin fest
fork.levelling.backfill=Aufwand und Zuordnung ableiten …
fork.levelling.run=Kapazität verteilen …
fork.levelling.noResource=Es ist keine Person angelegt. Ohne Ressource gibt es nichts zuzuordnen.
fork.levelling.manyResources=Es sind {0} Personen angelegt. Die Ableitung ordnet nur zu, wenn es genau eine gibt — sonst müsste sie raten, wer was macht.
fork.levelling.backfill.nothing=Es gibt nichts abzuleiten. Alle Vorgänge haben schon Aufwand und Zuordnung.
fork.levelling.backfill.preview={0} Vorgänge bekommen einen Aufwand, {1} eine Zuordnung zu „{2}" ({3} Std./Tag).\n\nDer Aufwand wird aus der bisherigen Dauer abgeleitet. Die Termine ändern sich dadurch NICHT — Dauer × Stunden pro Tag ergibt zurückgerechnet dieselbe Dauer.\n\nÜbersprungen: {4} Gruppen (leiten ihre Dauer ab), {5} Meilensteine (nichts zu leisten), {6} mit bereits gepflegtem Aufwand, {7} Wartevorgänge (dauern, sind aber keine Arbeit).
fork.levelling.backfill.undo=Aufwand und Zuordnung abgeleitet
fork.levelling.backfill.done={0} Vorgänge wurden ergänzt. Rückgängig macht alles in einem Schritt.
fork.levelling.noTasks=Es gibt keine Vorgänge zu verteilen.
fork.levelling.cycle=Die Abhängigkeiten laufen im Kreis. Es wurde nichts verschoben — bitte den Kreis auflösen.
fork.levelling.nothing=Es ist nichts zu verteilen: niemand ist überlastet.
fork.levelling.preview={0} von {1} Vorgängen werden verschoben, damit niemand mehr als 100 % gleichzeitig leisten muss.\n\nReihenfolge: erst Priorität, dann die Reihenfolge im Plan. Gleichzeitige Arbeit bleibt erlaubt, solange die Summe 100 % nicht übersteigt. Feste Termine bleiben stehen.
fork.levelling.unreachable={0,choice,1#Ein fester Termin ist|1<{0} feste Termine sind} nicht zu halten. Sie bleiben stehen - die Arbeit davor wird nicht rechtzeitig fertig:
fork.levelling.unreachable.row={0}: fest am {1}, frühestens möglich {2}
fork.levelling.more=und {0} weitere
fork.levelling.overload=An {0,choice,1#einem Tag|1<{0} Tagen} bleibt Ueberlast stehen, weil feste Termine sie erzwingen. Das Ressourcendiagramm zeigt sie.
fork.levelling.undo=Kapazität verteilt
fork.levelling.done={0} Vorgänge wurden verschoben. Rückgängig macht alles in einem Schritt.
fork.column.waitOnly=Warten

# Zeitabhaengige Tagesleistung ("ab dem 1.4. sind es acht Stunden"). Die Fehlermeldungen nennen
# ausdruecklich das erwartete Format: ein stillschweigend ignorierter Tippfehler wuerde den Plan
# plausibel und falsch machen.
fork.column.hoursSchedule=Stundenplan
fork.capacity.error.noSeparator=„{0}" nennt kein Datum und keine Stundenzahl. Erwartet wird „2027-04-01: 8".
fork.capacity.error.date=„{0}" ist kein Datum. Erwartet wird Jahr-Monat-Tag, also „2027-04-01".
fork.capacity.error.hours=„{0}" ist keine Stundenzahl.
fork.capacity.error.negative=„{0}" ist negativ. Weniger als null Stunden am Tag gibt es nicht.
fork.capacity.error.tooMany=„{0}" ist mehr als {1} Stunden an einem Tag.
fork.capacity.error.title=Der Stundenplan von „{0}" ist nicht lesbar
fork.capacity.error.consequence=Es wurde nichts geändert. Würde jetzt gerechnet, gälte für die fehlerhaften Abschnitte still die alte Stundenzahl — der Plan sähe richtig aus und wäre es nicht.

# Serienvorgaenge. Eine Serie ohne Begrenzung wird abgelehnt: irgendeine Zahl muesste erfunden
# werden, und die stuende nirgends.
fork.column.recurrence=Wiederholung
fork.recurrence.error.unknown=„{0}" versteht dieses Feld nicht. Erlaubt sind: täglich, wöchentlich, monatlich, jährlich, „alle N", „bis JJJJ-MM-TT", „Anzahl N".
fork.recurrence.error.interval=„{0}" ist kein gültiger Abstand. Erwartet wird „alle 2".
fork.recurrence.error.count=„{0}" ist keine gültige Anzahl. Erwartet wird „Anzahl 10".
fork.recurrence.error.date=„{0}" ist kein Datum. Erwartet wird Jahr-Monat-Tag, also „2027-12-31".
fork.recurrence.error.noUnit=Es fehlt, wie oft sich der Vorgang wiederholt: täglich, wöchentlich, monatlich oder jährlich.
fork.recurrence.error.noLimit=Es fehlt das Ende der Serie. Erwartet wird „bis 2027-12-31" oder „Anzahl 10". Ohne Ende müsste eine Zahl erfunden werden, die nirgends steht.
fork.recurrence.error.twoLimits=„bis" und „Anzahl" zusammen ergeben zwei verschiedene Enden. Bitte nur eines von beiden.
fork.recurrence.error.title=Die Wiederholung von „{0}" ist nicht lesbar
fork.recurrence.error.consequence=Es wurde nichts angelegt. Die übrigen Serien wurden ebenfalls nicht angelegt — sonst wäre nach dem Beheben unklar, was schon existiert.

fork.recurrence.run=Serienvorgänge anlegen …
fork.recurrence.none=Es ist keine Wiederholung eingetragen. Die Spalte „Wiederholung" nimmt zum Beispiel „monatlich; bis 2027-12-31" auf.
fork.recurrence.nothingNew=Es gibt nichts anzulegen. Alle Termine der eingetragenen Serien stehen bereits im Plan.
fork.recurrence.preview=Es {1,choice,1#wird ein Vorgang|1<werden {1} Vorgaenge} angelegt, aus {0,choice,1#einer Serie|1<{0} Serien}.\n\nJede Wiederholung bekommt Namen, Dauer, Aufwand und Zuordnung des Ausgangsvorgangs und wird als dessen Wiederholung gekennzeichnet. Bereits vorhandene Wiederholungen werden nicht noch einmal angelegt.\n\nFällt ein Termin auf ein Wochenende oder einen Feiertag, rückt er auf den nächsten Arbeitstag vor.
fork.recurrence.truncated={0,choice,1#Eine Serie erreicht|1<{0} Serien erreichen} die Obergrenze von {1} Terminen. Vermutlich ist die Begrenzung zu weit gefasst.
fork.recurrence.undo=Serienvorgänge angelegt
fork.recurrence.done={0} Vorgänge wurden angelegt. Rückgängig macht alles in einem Schritt.
fork.column.recurrenceOf=Wiederholung von

# Frist, Auslastungsgrad, urspruenglicher Aufwand und der Basisplan vor dem Verteilen.
fork.column.deadline=Fertig bis
fork.column.utilisation=Auslastung (%)
fork.column.effortOriginal=Aufwand urspruenglich (Std.)
fork.levelling.deadline={0,choice,1#Eine Frist ist|1<{0} Fristen sind} mit der vorhandenen Kapazitaet nicht zu halten. Sie {0,choice,1#wird|1<werden} NICHT erzwungen - das wuerde das Problem nur an eine Stelle schieben, an der es niemand sieht:
fork.levelling.deadline.row={0}: fertig bis {1}, tatsaechlich {2} - {3} Arbeitstage zu spaet
fork.levelling.frozen={0,choice,1#Ein Vorgang ist|1<{0} Vorgaenge sind} angefangen oder erledigt und {0,choice,1#bleibt|1<bleiben}, wo er liegt. Die Kapazitaet ist weiterhin belegt.
fork.levelling.utilisation=Gerechnet wird mit {0} % Auslastung pro Arbeitstag.
fork.baseline.ask=Vor dem Verteilen einen Basisplan sichern?
fork.baseline.what=Ein Basisplan haelt die heutigen Termine fest. Das Diagramm zeigt sie danach als zweiten Balken unter den neuen - so bleibt sichtbar, was sich durch die Verteilung verschoben hat.
fork.baseline.hint=Ohne Basisplan sind die bisherigen Termine nach dem Speichern weg. Rueckgaengig hilft nur, solange das Programm laeuft.
fork.baseline.name=Vor der Verteilung {0}
fork.baseline.done=Basisplan „{0}“ gesichert.

# Auswertung der Schaetzguete. Verglichen werden STUNDEN gegen die URSPRUENGLICHE Schaetzung --
# der Zeitraum, ueber den sie anfielen, spielt dabei keine Rolle.
fork.estimate.run=Aufwand: geschaetzt gegen gebraucht
fork.estimate.noBasis=Es gibt noch nichts zu vergleichen. Dafuer braucht es abgeschlossene Vorgaenge, die sowohl eine urspruengliche Schaetzung als auch erfasste Stunden haben.
fork.estimate.summary={0,choice,1#Ein abgeschlossener Vorgang|1<{0} abgeschlossene Vorgaenge}: geschaetzt {1,number,0.0} Std., gebraucht {2,number,0.0} Std. Das ist das {3,number,0.00}-fache.
fork.estimate.noOverrun=Kein abgeschlossener Vorgang hat mehr gebraucht als geschaetzt.
fork.estimate.overruns={0,choice,1#Ein abgeschlossener Vorgang hat|1<{0} abgeschlossene Vorgaenge haben} mehr gebraucht als geschaetzt:
fork.estimate.running={0,choice,1#Ein laufender Vorgang liegt|1<{0} laufende Vorgaenge liegen} JETZT SCHON ueber der Schaetzung:
fork.estimate.row={0}: {1,number,0.0} geschaetzt, {2,number,0.0} gebraucht ({3,number,0.00}-fach)
fork.estimate.forecast=Hochrechnung: offen sind {0,number,0.0} Std. laut Plan. Mit dem gemessenen Faktor waeren es {1,number,0.0} Std. - also {2,number,0.0} Std. mehr, als der Plan kennt. Das ist eine Hochrechnung, keine Messung.

# Die Rueckfrage zu liegengebliebener Arbeit. Sie wird NUR gestellt, wenn es solche Vorgaenge
# gibt -- eine Frage ohne Anlass ist eine Frage, die man wegklickt.
fork.levelling.past.ask={0} Vorgaenge liegen in der Vergangenheit, und es ist keine Zeit darauf erfasst. Sollen sie nach vorn geschoben werden?
fork.levelling.past.what=Diese Vorgaenge sind offenbar liegengeblieben: sie waren fuer einen Termin vor heute geplant, begonnen wurde nie.
fork.levelling.past.hint=Abgeschlossene und angefangene Vorgaenge werden in KEINEM Fall verschoben. Bei angefangenen wird nur der noch offene Rest mit der heutigen Tagesleistung gerechnet.
fork.baseline.failed=Der Basisplan konnte nicht angelegt werden. Einzelheiten stehen im Protokoll. Die Verteilung selbst ist davon unberuehrt.
fork.levelling.backfill.original=Bei {0} Vorgaengen wird ausserdem der heutige Aufwand als URSPRUENGLICHER festgehalten. Das geschieht genau einmal; danach bleibt der Wert stehen, auch wenn die Schaetzung spaeter korrigiert wird. Er ist der Vergleichswert fuer die erfassten Stunden.

# Benannte Ansichten fuer grosse Plaene. Eine Ansicht ist eine BENANNTE MENGE AUSGEBLENDETER
# VORGAENGE; die Menge fuehrt das AUSGEBLENDETE, nicht das Eingeblendete. Deshalb bleibt ein
# spaeter angelegter Vorgang in jeder Ansicht sichtbar, statt aus allen auf einmal zu fallen.
fork.view.hideTask=In dieser Ansicht ausblenden
fork.view.showTask=In dieser Ansicht wieder einblenden
fork.view.showAll=Alles anzeigen
fork.view.manage=Ansichten verwalten …
fork.view.defaultName=Neue Ansicht
fork.view.hiddenCount={0,choice,0#nichts ausgeblendet|1#ein Vorgang ausgeblendet|1<{0} Vorgaenge ausgeblendet}
# Steht in der Werkzeugleiste ueber der Vorgangstabelle und ist zugleich der Rueckweg: ein Klick
# zeigt wieder alles. Im Original ist das eine Beschriftung, die man nicht anklicken kann.
fork.view.tasksHidden={0,choice,1#Ein Vorgang ist ausgeblendet - alles anzeigen|1<{0} Vorgaenge sind ausgeblendet - alles anzeigen}

fork.viewDialog.title=Vorgangsansichten
fork.viewDialog.addItem=Neue Ansicht
