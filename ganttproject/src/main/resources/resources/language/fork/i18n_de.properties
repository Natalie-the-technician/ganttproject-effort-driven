fork.vacation.reversed.one=Ein Urlaub in dieser Datei endet vor seinem Anfang.
fork.vacation.reversed.many={0} Urlaube in dieser Datei enden vor ihrem Anfang.
fork.vacation.reversed.item={0}: Anfang {1}, Ende {2} — geladen als ein Tag am {1}.
fork.vacation.reversed.consequence=Dort ist mindestens eine der beiden Zahlen falsch, und die Datei sagt nicht welche. Gerechnet wird mit dem Anfangstag. Beim naechsten Speichern wird der berichtigte Wert geschrieben — wer das nicht will, muss die Datei vorher von Hand richtigstellen.
fork.column.workWeek=Arbeitswoche
fork.workweek.error.date=„{0}" ist kein Datum. Erwartet wird Jahr-Monat-Tag, also „2026-03-01".
fork.workweek.error.day=„{0}" ist kein Wochentag. Erwartet werden 1 bis 7, also „1,2,5,6" für Mo, Di, Fr, Sa.

