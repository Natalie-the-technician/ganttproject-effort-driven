# [fork change] The absence preview -- what one person's days off cost the plan. THREE LINES, and
# the third is a line and not a list: in all 55 measured runs on this fork's reference shape the
# median shift equalled the largest one, so a list of 215 moved tasks would write "+7 days" 215
# times. The measurement is 2026-09-05-vorschau-gemessen.md; the reasoning is in VacationPreview.kt.
fork.vacation.preview.head=What this absence costs the plan:
fork.vacation.preview.nothing=This absence moves nothing: no task shifts, and the project end stays where it is.
fork.vacation.preview.end.same=Project end: {0} - unchanged.
fork.vacation.preview.end.changed=Project end: {0} -> {1} ({2}).
fork.vacation.preview.end.unknown=Project end: cannot be determined - no task got a date.
# "one week" for exactly seven, because that is the way anybody entering a week off will read it
# back. The choice limits ascend: 1, just above 1, 7, just above 7.
fork.vacation.preview.amount={0,choice,1#one calendar day|1<{0} calendar days|7#one week|7<{0} calendar days}
fork.vacation.preview.later={0} later
fork.vacation.preview.earlier={0} earlier
fork.vacation.preview.shift.uniform={0} of {1} tasks move {2} - every one of them by that same amount.
fork.vacation.preview.shift.spread={0} of {1} tasks move: the least {2}, the most {3}, the middle one {4}.
fork.vacation.preview.deadline.broken={0,choice,1#One deadline is|1<{0} deadlines are} missed because of this, and {0,choice,1#it was|1<they were} being met before it:
fork.vacation.preview.deadline.none=No deadline is missed because of this ({0,choice,1#one task carries|1<{0} tasks carry} one).
fork.vacation.preview.deadline.already=({0,choice,1#One deadline was|1<{0} deadlines were} already being missed before this absence. That is not a consequence of it.)
fork.vacation.preview.hint=Computed, not written: every date in the plan stays where it is until the workload is levelled. Both dates above are levelled plans - one without this absence and one with it.
# The other half of what an absence does: an assignment NOT marked as indispensable does not move
# the task, it lengthens it -- the hours drop out and the days stay. See VacationPreview.stretchedIds.
fork.vacation.preview.longer={0,choice,1#One task gets|1<{0} tasks get} longer without moving - the hours of the absent person drop out of the day.
