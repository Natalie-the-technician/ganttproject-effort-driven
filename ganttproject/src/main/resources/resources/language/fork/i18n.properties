# NEUE DATEI DIESES FORKS - im Original-GanttProject nicht vorhanden.
#
# Texts added by this fork, English. This file is the fallback: a key missing from a
# translation is answered from here, so a new string is never invisible.
#
# All keys start with "fork." so they cannot collide with a GanttProject key.
# See ForkI18n.kt for why this fork carries its own bundle.

fork.effort.section=Effort
fork.effort.hours=Hours
fork.effort.hoursPerDay=Hrs/day
fork.effort.actualHours=Actual hours

# Display names of the custom properties this fork creates. These become COLUMN HEADERS in the
# task and resource tables, and they are written into the project file as part of the column
# definition. The technical id (effort_hours, ...) is separate and never translated -- everything
# looks the property up by that id, see findEffortDefinition.
fork.column.effort=Effort (h)
fork.column.actualEffort=Actual effort (h)
fork.column.hoursPerDay=Hours per day

# Resource levelling. Both menu items ASK before writing -- on Natalie's plan the levelling moves
# 167 of 226 tasks.
fork.column.dateFixed=Date fixed
fork.levelling.backfill=Derive effort and assignment …
fork.levelling.run=Level the workload …
fork.levelling.noResource=No person exists. Without a resource there is nothing to assign to.
fork.levelling.manyResources={0} people exist. The derivation only assigns when there is exactly one — otherwise it would have to guess who does what.
fork.levelling.backfill.nothing=Nothing to derive. Every task already has effort and an assignment.
fork.levelling.backfill.preview={0} tasks get an effort, {1} get an assignment to "{2}" ({3} h/day).\n\nThe effort is derived from the current duration. The dates do NOT change — duration × hours per day gives the same duration back.\n\nSkipped: {4} containers (they derive their duration), {5} milestones (nothing to do), {6} that already carry an effort, {7} waiting tasks (they take time but are not work).
fork.levelling.backfill.undo=Effort and assignment derived
fork.levelling.backfill.done={0} tasks were completed. Undo reverts everything in one step.
fork.levelling.noTasks=There are no tasks to level.
fork.levelling.cycle=The dependencies form a cycle. Nothing was moved — please resolve the cycle.
fork.levelling.nothing=Nothing to level: nobody is overloaded.
fork.levelling.preview={0} of {1} tasks will be moved so that nobody has to deliver more than 100 % at once.\n\nOrder: priority first, then the order in the plan. Working on several tasks at once stays allowed as long as the sum stays within 100 %. Fixed dates stay put.
fork.levelling.unreachable={0,choice,1#One fixed date cannot|1<{0} fixed dates cannot} be met. They stay put - the work leading up to them will not be finished in time:
fork.levelling.unreachable.row={0}: fixed on {1}, earliest possible {2}
fork.levelling.more=and {0} more
fork.levelling.overload=On {0,choice,1#one day|1<{0} days} an overload remains because fixed dates force it. The resource chart shows them.
fork.levelling.undo=Workload levelled
fork.levelling.done={0} tasks were moved. Undo reverts everything in one step.
fork.column.waitOnly=Waiting

# Time-dependent daily capacity ("from 1 April it is eight hours"). The error messages name the
# expected format on purpose: a silently ignored typo would make the plan plausible and wrong.
fork.column.hoursSchedule=Hours schedule
fork.capacity.error.noSeparator="{0}" names neither a date nor a number of hours. Expected "2027-04-01: 8".
fork.capacity.error.date="{0}" is not a date. Expected year-month-day, i.e. "2027-04-01".
fork.capacity.error.hours="{0}" is not a number of hours.
fork.capacity.error.negative="{0}" is negative. There are no fewer than zero hours in a day.
fork.capacity.error.tooMany="{0}" is more than {1} hours in a single day.
fork.capacity.error.title=The hours schedule of "{0}" cannot be read
fork.capacity.error.consequence=Nothing was changed. Computing now would silently use the old number of hours for the faulty entries — the plan would look right and would not be.

# Recurring tasks. A series without a limit is rejected: some number would have to be invented,
# and it would be written down nowhere.
fork.column.recurrence=Recurrence
fork.recurrence.error.unknown="{0}" is not understood here. Allowed: daily, weekly, monthly, yearly, "every N", "until YYYY-MM-DD", "count N".
fork.recurrence.error.interval="{0}" is not a valid interval. Expected "every 2".
fork.recurrence.error.count="{0}" is not a valid count. Expected "count 10".
fork.recurrence.error.date="{0}" is not a date. Expected year-month-day, i.e. "2027-12-31".
fork.recurrence.error.noUnit=It is missing how often the task repeats: daily, weekly, monthly or yearly.
fork.recurrence.error.noLimit=The end of the series is missing. Expected "until 2027-12-31" or "count 10". Without an end, a number would have to be invented that is written down nowhere.
fork.recurrence.error.twoLimits="until" and "count" together give two different ends. Please use only one of them.
fork.recurrence.error.title=The recurrence of "{0}" cannot be read
fork.recurrence.error.consequence=Nothing was created. The other series were not created either — otherwise it would be unclear afterwards what already exists.

fork.recurrence.run=Create recurring tasks …
fork.recurrence.none=No recurrence is entered. The "Recurrence" column takes e.g. "monthly; until 2027-12-31".
fork.recurrence.nothingNew=There is nothing to create. Every occurrence of the entered series is already in the plan.
fork.recurrence.preview={1,choice,1#One task|1<{1} tasks} will be created, from {0,choice,1#one series|1<{0} series}.\n\nEach occurrence gets the name, duration, effort and assignment of the source task and is marked as its repetition. Existing occurrences are not created twice.\n\nIf an occurrence falls on a weekend or a holiday, it moves forward to the next working day.
fork.recurrence.truncated={0,choice,1#One series reaches|1<{0} series reach} the upper limit of {1} occurrences. The limit is most likely too wide.
fork.recurrence.undo=Recurring tasks created
fork.recurrence.done={0} tasks were created. Undo reverts everything in one step.
fork.column.recurrenceOf=Repetition of

