# NEUE DATEI DIESES FORKS - im Original-GanttProject nicht vorhanden.
#
# Texts added by this fork, English. This file is the fallback: a key missing from a
# translation is answered from here, so a new string is never invisible.
#
# All keys start with "fork." so they cannot collide with a GanttProject key.
# See ForkI18n.kt for why this fork carries its own bundle.

fork.effort.section=Effort
fork.effort.hours=Hours
fork.effort.hoursPerDay=Hrs/day
fork.effort.actualHours=Actual hours

# Display names of the custom properties this fork creates. These become COLUMN HEADERS in the
# task and resource tables, and they are written into the project file as part of the column
# definition. The technical id (effort_hours, ...) is separate and never translated -- everything
# looks the property up by that id, see findEffortDefinition.
fork.column.effort=Effort (h)
fork.column.actualEffort=Actual effort (h)
fork.column.hoursPerDay=Hours per day
fork.column.togglImported=Toggl imported

fork.toggl.section=Time tracking
fork.toggl.token=Toggl token
fork.toggl.checkConnection=Check Toggl connection

# Outcome of the connection check. {0} is the person, {1} a count.
# Built from the failure kind, NOT from the exception message: that one is English prose for
# the log.
# Two tokens claim the same key. {0} is the address or the name.
# The buttons name what is LOST -- "overwrite" alone says nothing about that, and the loss
# otherwise only shows up much later.
fork.toggl.collision.title=Two Toggl tokens for the same person
fork.toggl.collision.what=A different Toggl token is already stored for "{0}". Only one of them can stay.
fork.toggl.collision.consequence=The address identifies the Toggl account. Two different tokens for one address means one of them is stale. Which one cannot be told from here.
# The consequence goes in the text, NOT in the button label: buttons have a fixed width and a
# longer label is truncated, which would make the consequence unreadable. Observed on screen.
fork.toggl.collision.choice="Keep the new one" discards the token stored until now. "Keep the stored one" discards the one just entered. The discarded one is gone and would have to be entered again.
fork.toggl.collision.overwrite=Keep the new one
fork.toggl.collision.discard=Keep the stored one

# Importing the times. {0} and {1} are counts or hours.
fork.toggl.import=Import Toggl times
fork.toggl.import.running=Fetching the times of the last {0} days …
# Period of the import. A number rather than an "also older" tickbox: "older" has no end.
fork.toggl.period.title=Period of the import
fork.toggl.period.what=How many days back should the Toggl entries be fetched?
fork.toggl.period.hint=Entries imported before are not counted twice. At most {0} days.
fork.toggl.period.invalid=Please enter a whole number between {0} and {1}.
fork.toggl.import.undo=Toggl times imported
fork.toggl.import.preview={1,number,0.00} hours will be credited to {0} tasks. Planned duration, effort, status and completion are left untouched.
fork.toggl.import.overrun=On {0} tasks the recorded hours exceed the planned effort. That is a hint — nothing is corrected.
fork.toggl.import.nothingNew=There is nothing new to take over. Every entry found was imported before.
fork.toggl.import.done={0} tasks were updated. Undo reverts the whole import in one step.
fork.toggl.import.failed=Writing failed on {0} tasks. Details are in the log.
fork.toggl.import.unknownNumber={0} entries name a task number that does not exist in this project. Most likely a typo in Toggl.
fork.toggl.import.withoutNumber={0} entries name no task number and were skipped. For now they can only be assigned by adding the number in Toggl, e.g. "#332 Firmware".

fork.toggl.check.title=Toggl connection
fork.toggl.check.noToken=No Toggl token is stored. A token is entered in the properties of a resource, section Time tracking.
fork.toggl.check.ok=The connection works. {1} entries were found for {0} over the last seven days. Nothing was changed.
fork.toggl.check.unreadable={0} of them could not be read:
fork.toggl.check.notAuthorised=Toggl refused the token for {0}. Please check the token in the properties of that resource.
fork.toggl.check.rateLimited=Toggl reported too many requests. Please wait a moment and try again.
fork.toggl.check.quotaExhausted=The Toggl request quota is exhausted for this billing period.
fork.toggl.check.unavailable=Toggl could not be reached. Please check the internet connection. Details are in the log.
fork.toggl.check.running=Checking the connection …

# Why a manual split of one time entry was rejected. Shown in the matching dialog.
# {0} and {1} are hours; the format pattern belongs to the translation, not to the code.
fork.split.empty=No parts were given.
fork.split.notPositive=Every part must be a positive number of hours.
fork.split.duplicateTask=The same task appears twice.
fork.split.sumMismatch=The parts add up to {0,number,0.00} h, but the entry has {1,number,0.00} h.
