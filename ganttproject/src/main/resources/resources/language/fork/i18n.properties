# Recurring tasks. A series without a limit is rejected: some number would have to be invented,
# and it would be written down nowhere.
fork.column.recurrence=Recurrence
fork.recurrence.error.unknown="{0}" is not understood here. Allowed: daily, weekly, monthly, yearly, "every N", "until YYYY-MM-DD", "count N".
fork.recurrence.error.interval="{0}" is not a valid interval. Expected "every 2".
fork.recurrence.error.count="{0}" is not a valid count. Expected "count 10".
fork.recurrence.error.date="{0}" is not a date. Expected year-month-day, i.e. "2027-12-31".
fork.recurrence.error.noUnit=It is missing how often the task repeats: daily, weekly, monthly or yearly.
fork.recurrence.error.noLimit=The end of the series is missing. Expected "until 2027-12-31" or "count 10". Without an end, a number would have to be invented that is written down nowhere.
fork.recurrence.error.twoLimits="until" and "count" together give two different ends. Please use only one of them.
fork.recurrence.error.title=The recurrence of "{0}" cannot be read
fork.recurrence.error.consequence=Nothing was created. The other series were not created either — otherwise it would be unclear afterwards what already exists.

