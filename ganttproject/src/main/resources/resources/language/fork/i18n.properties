fork.assignment.noEffort=No effort

# No possible date at all (P5 + P6, merged in P7). The case fell back SILENTLY until P5: the
# search runs into its bound and lays the task on its earliest date -- a visibly wrong date with
# no reason given. P5 said one reason, P6 the other, in two blocks; a task that had both stood in
# both of them. Since 27.08.2026 there is ONE block and one entry per task, carrying every reason
# that applied.
#
# THE WAY OUT SITS IN THE REASON LINES AND NOT IN THE HEADING, and that is the point of the merge
# rather than a rearrangement. The old headings each ended in one remedy; over a block whose tasks
# failed for different reasons any single remedy is wrong for some of them, and where both reasons
# apply BOTH are true and either one alone is enough. The heading now says only that much.
fork.levelling.nodate={0,choice,1#One task finds|1<{0} tasks find} no date to sit on at all. {0,choice,1#It stays|1<They stay} on the earliest possible date - that date is wrong, and levelling cannot put it right by itself. What can be done about it stands under each task; where two reasons are listed, relieving EITHER one is enough:
fork.levelling.nodate.task={0}:
# Worded so that it reads for ONE name as well as for several. A single person marked as blocking
# and never present is a real and reported case -- see testASinglePersonWhoIsNeverThereIsReportedToo
# -- and the old wording it replaces ("{1} all have to be there at the same time") did not.
# [fork change] B3. A SEPARATE SENTENCE FROM nodate.blocked, and the difference is the remedy, not
# the wording: nobody's days off have to change here. The task is marked as needing somebody on
# site and the person it needs works from home -- so what can be changed is the marking of the
# task, or where that person works.
fork.levelling.nodate.homework=the task needs somebody on the premises, and {0} work from home on every date that came into question. Nobody is absent here. What has to change is the marking of the task, or the home-office arrangement of those named.
fork.levelling.nodate.blocked=the available times of {0} never overlap for long enough - there is no stretch in which everybody marked as blocking is at work at once. "Everybody has to be there" cannot be relaxed without saying the opposite of the marking, so what has to change is the markings or the days off.
# Deliberately what was MEASURED and not more: the search bounced off days that were already
# booked. It does not claim that every day is full -- see NoPossibleDate.fullFor.
# "those named" and not "those people": {0} can hold fork.levelling.nodate.shared, the pool of the
# tasks nobody is assigned to, and that is not a person. Measured on the rendered text.
fork.levelling.nodate.full=no date with room: the working days of {0} are already taken on every date that came into question. What has to change is the workload of those named, or the length of the task.
# The pool of the tasks nobody is assigned to. They occupy time, one just does not know whose,
# and a report that names them with a blank would say less than nothing.
fork.levelling.nodate.shared=tasks without an assignment

