# Outcome of the connection check. {0} is the person, {1} a count.
# Built from the failure kind, NOT from the exception message: that one is English prose for
# the log.
# Two tokens claim the same key. {0} is the address or the name.
# The buttons name what is LOST -- "overwrite" alone says nothing about that, and the loss
# otherwise only shows up much later.
fork.toggl.collision.title=Two Toggl tokens for the same person
fork.toggl.collision.what=A different Toggl token is already stored for "{0}". Only one of them can stay.
fork.toggl.collision.consequence=The address identifies the Toggl account. Two different tokens for one address means one of them is stale. Which one cannot be told from here.
# The consequence goes in the text, NOT in the button label: buttons have a fixed width and a
# longer label is truncated, which would make the consequence unreadable. Observed on screen.
fork.toggl.collision.choice="Keep the new one" discards the token stored until now. "Keep the stored one" discards the one just entered. The discarded one is gone and would have to be entered again.
fork.toggl.collision.overwrite=Keep the new one
fork.toggl.collision.discard=Keep the stored one

