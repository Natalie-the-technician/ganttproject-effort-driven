# WebDAV: the lock could not be taken on open. {0} is the file name.
fork.webdav.lockFailed=No lock could be taken for "{0}" — most likely somebody else has the project open. The project is open and readable. On saving, the file is checked for changes made meanwhile; on a conflict you are asked rather than overwriting.

# Write conflict outside the GanttProject cloud (WebDAV or a local file). The stock text
# "cloud.versionMismatch" explains the conflict with "version fetched from history", which is not
# what happened here: somebody else changed the file since it was read.
fork.webdav.versionMismatch.title=File changed by somebody else
fork.webdav.versionMismatch.titleHelp=Since you opened it, this project file has been changed by somebody else.\nSaving now would discard that change.\nYour own edits are kept either way — they can be saved as a new copy.

# Hint under the two locking options. A value below 0 means "never lock", and acquireLock() reports
# success while doing nothing -- without this line, that state is invisible. Naming what still
# protects matters: since D3 the write is conditional, so "unprotected" would be wrong.
fork.webdav.lockTimeout.hint=<html>A value below 0 means: never lock. Others can then edit the file at the same time.<br>Changes made meanwhile are still detected when saving — you are asked instead of overwriting.</html>

# The server only ever answers with weak ETags, so no write can be made conditional. NOBODY changed
# the file -- do not reuse the conflict wording, it would send the user looking for a colleague who
# does not exist.
fork.webdav.noVersioning.title=Server cannot confirm the version
fork.webdav.noVersioning.titleHelp=This server does not tell us which version of the file it holds, so saving cannot be checked against it.\nWriting anyway could overwrite somebody else's change without noticing.\nYour edits are not lost — they can be saved as a new copy.

# Read failures that are NOT a broken file. The stock code labels every exception "Failed to parse
# document", which sends the user looking at their project file when the server rejected them.
fork.document.notAuthorized=The server refused the login. Most likely no password is stored for this WebDAV server — open the project via Project → Open and enter it there.
fork.document.unreachable=The server could not be reached. Please check the network connection and the server address.

