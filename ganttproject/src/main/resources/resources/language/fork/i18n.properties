# WHY THEY HAD TO BE REWRITTEN: the band means something different in each of the three
# comparison views, and the dialog does not know which one is showing. So no line may name a
# quantity -- an end date, a duration, a number of hours. What stays the same in all three is
# the DIRECTION: the measured value lies above or below the planned one.
#
