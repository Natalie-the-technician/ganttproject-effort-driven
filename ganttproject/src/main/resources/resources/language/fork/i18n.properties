# Texts added by this fork, English. This file is the fallback: a key missing from a
# translation is answered from here, so a new string is never invisible.
#
# All keys start with "fork." so they cannot collide with a GanttProject key.
# See ForkI18n.kt for why this fork carries its own bundle.

