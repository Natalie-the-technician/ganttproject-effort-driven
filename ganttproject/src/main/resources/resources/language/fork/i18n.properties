fork.estimate.summary={0,choice,1#One finished task|1<{0} finished tasks}: estimated {1,number,0.0} h, actually {2,number,0.0} h. That is {3,number,0.00} times the estimate.
fork.estimate.noOverrun=No finished task took more than estimated.
fork.estimate.overruns={0,choice,1#One finished task|1<{0} finished tasks} took more than estimated:
fork.estimate.running={0,choice,1#One running task is|1<{0} running tasks are} ALREADY over the estimate:
fork.estimate.row={0}: {1,number,0.0} estimated, {2,number,0.0} actual ({3,number,0.00}x)
fork.estimate.forecast=Forecast: {0,number,0.0} h are still open per plan. With the measured factor that would be {1,number,0.0} h - {2,number,0.0} h more than the plan knows. This is a forecast, not a measurement.

# The question about work left behind. Asked ONLY when such tasks exist.
fork.levelling.past.ask={0} tasks lie in the past with no time recorded on them. Should they be moved forward?
fork.levelling.past.what=These tasks were apparently left behind: they were planned for a date before today and never started.
fork.levelling.past.hint=Finished and started tasks are NEVER moved. For started ones only the remaining part is recomputed with today's capacity.
fork.baseline.failed=The baseline could not be created. Details are in the log. The levelling itself is unaffected.
fork.levelling.backfill.original=For {0} tasks today's effort is also recorded as the ORIGINAL one. This happens exactly once; the value then stays even if the estimate is corrected later. It is the reference for the recorded hours.
